services:
  - type: web
    name: msme-navigator
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: HF_MODEL
        value: Qwen/Qwen2.5-72B-Instruct
      - key: HF_TOKEN
        sync: false
