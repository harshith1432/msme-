name: MSME Navigator CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Test Suite & Quality Gates
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest Test Suite
      env:
        FLASK_ENV: testing
        CELERY_TASK_ALWAYS_EAGER: "true"
        STORAGE_BACKEND: local
      run: |
        python -m pytest --disable-warnings -v

    - name: Verify Docker Build
      run: |
        docker build -t msme-navigator:ci .

  deploy-render:
    name: Trigger Render Deploy Hook (Optional)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render via Webhook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Triggering Render auto-deploy..."
            curl -s -X POST "$DEPLOY_HOOK"
            echo "Render deployment triggered successfully."
          else
            echo "RENDER_DEPLOY_HOOK_URL not set; relying on Render native GitHub auto-deploy."
          fi
