services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/static:/var/www/static:ro
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 --threads 2 --timeout 60 wsgi:app
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - CELERY_TASK_ALWAYS_EAGER=false
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_PRIVATE=${S3_BUCKET_PRIVATE}
      - S3_BUCKET_KNOWLEDGE=${S3_BUCKET_KNOWLEDGE}
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: celery -A backend.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_PRIVATE=${S3_BUCKET_PRIVATE}
      - S3_BUCKET_KNOWLEDGE=${S3_BUCKET_KNOWLEDGE}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data:
